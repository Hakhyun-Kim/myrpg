<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyRPG — 하란 (3D)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10141c; color: #eee;
        font-family: 'Malgun Gothic', system-ui, sans-serif; overflow: hidden; }
      #app { position: relative; width: 100vw; height: 100vh; }
      #app canvas { display: block; }

      #login { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, #1c2433 0%, #10141c 70%); z-index: 10; }
      #login form { display: flex; flex-direction: column; gap: 12px; width: 280px; }
      #login h1 { font-size: 22px; text-align: center; margin: 0 0 4px; color: #e6c76a; letter-spacing: 1px; }
      #login .sub { text-align: center; font-size: 12px; color: #7a8699; margin-bottom: 8px; }
      #login input { padding: 11px; border-radius: 8px; border: 1px solid #3a4356; background: #1a2130; color: #eee; }
      #login button { padding: 11px; border-radius: 8px; border: 0; background: #e6c76a; color: #10141c;
        font-weight: bold; cursor: pointer; }
      #login .err { color: #e57373; font-size: 12px; min-height: 16px; text-align: center; }

      #hud { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 5; }
      #inv { position: absolute; top: 12px; right: 12px; background: rgba(16,20,28,.8); border: 1px solid #3a4356;
        border-radius: 10px; padding: 10px 14px; min-width: 140px; font-size: 13px; backdrop-filter: blur(4px); }
      #inv h2 { margin: 0 0 6px; font-size: 12px; color: #e6c76a; }
      #chatlog { position: absolute; left: 12px; bottom: 50px; width: 340px; max-height: 190px; overflow: hidden;
        display: flex; flex-direction: column; justify-content: flex-end; font-size: 13px; text-shadow: 0 1px 3px #000; }
      #chatlog div { padding: 1px 4px; }
      #chatlog .sys { color: #8a94a6; }
      #chatbox { position: absolute; left: 12px; bottom: 12px; width: 340px; pointer-events: auto; }
      #chatbox input { width: 100%; box-sizing: border-box; padding: 9px; border-radius: 8px;
        border: 1px solid #3a4356; background: rgba(16,20,28,.85); color: #eee; }
      #gatherbar { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); width: 220px; height: 10px;
        background: rgba(16,20,28,.8); border: 1px solid #3a4356; border-radius: 6px; display: none; overflow: hidden; }
      #gatherbar > div { height: 100%; width: 0%; background: #e6c76a; }
      #hint { position: absolute; top: 12px; left: 12px; font-size: 12px; color: #7a8699; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="login">
        <form id="login-form">
          <h1>MyRPG — 하란 마을</h1>
          <div class="sub">고비주얼 클라이언트 (3D) · 테스트 클라이언트는 :5173 / /test</div>
          <input id="name" placeholder="이름 (2~16자)" autocomplete="off" maxlength="16" />
          <button type="submit">입장</button>
          <div class="err" id="login-err"></div>
        </form>
      </div>
      <div id="hud">
        <div id="hint">클릭: 이동 · 자원 클릭: 채집 · 휠: 줌 · Enter: 채팅</div>
        <div id="inv"><h2>가방</h2><div id="inv-items">비어 있음</div></div>
        <div id="chatlog"></div>
        <div id="gatherbar"><div></div></div>
        <div id="chatbox"><input id="chat-input" placeholder="Enter로 채팅" maxlength="200" /></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
