<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyRPG — 하란 (3D)</title>
    <style>
      :root {
        --bg: #10141c;
        --panel: rgba(18, 23, 33, .88);
        --line: #333e52;
        --gold: #e6c76a;
        --text: #e8ecf2;
        --muted: #8a94a6;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: 'Malgun Gothic', system-ui, sans-serif; overflow: hidden; }
      #app { position: relative; width: 100vw; height: 100vh; }
      #app canvas { display: block; }
      button { font-family: inherit; }

      /* ---- 로그인 ---- */
      #login { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, #1c2433 0%, #10141c 70%); z-index: 20; }
      #login form { display: flex; flex-direction: column; gap: 12px; width: 300px; }
      #login h1 { font-size: 24px; text-align: center; margin: 0 0 2px; color: var(--gold); letter-spacing: 1px; }
      #login .sub { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.6; }
      #login input { padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: #1a2130; color: var(--text); }
      #login button { padding: 12px; border-radius: 8px; border: 0; background: var(--gold); color: var(--bg);
        font-weight: bold; cursor: pointer; font-size: 14px; }
      #login .err { color: #e57373; font-size: 12px; min-height: 16px; text-align: center; }

      /* ---- HUD 골격: 좌상단 정보 · 우측 사이드바 · 하단 채팅 ---- */
      #hud { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 5; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        backdrop-filter: blur(6px); }
      .panel h2 { margin: 0 0 7px; font-size: 11px; color: var(--gold); letter-spacing: .5px;
        text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
      .muted { color: var(--muted); }

      #topleft { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; }
      #hint { font-size: 11px; color: var(--muted); background: var(--panel); border: 1px solid var(--line);
        border-radius: 8px; padding: 6px 10px; }

      /* 우측: 한 컬럼에 세로로 쌓아 겹침을 원천 차단 */
      #sidebar { position: absolute; top: 12px; right: 12px; bottom: 12px; width: 208px;
        display: flex; flex-direction: column; gap: 8px; overflow-y: auto; pointer-events: auto;
        scrollbar-width: thin; }
      #sidebar::-webkit-scrollbar { width: 6px; }
      #sidebar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
      #sidebar > .panel { padding: 9px 12px; font-size: 12px; flex: none; }

      #purse { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      #silver { color: var(--gold); font-weight: bold; font-size: 14px; }
      #market-toggle { border: 0; border-radius: 6px; background: var(--gold); color: var(--bg);
        font-weight: bold; padding: 5px 12px; cursor: pointer; font-size: 12px; }
      #inv-items { line-height: 1.7; }
      #skills-list { line-height: 1.7; font-size: 11px; }

      /* 제작 */
      .recipe { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin: 4px 0; }
      .recipe > span:first-child { line-height: 1.3; }
      .recipe button { border: 0; border-radius: 4px; background: #33405a; color: var(--text); cursor: pointer;
        padding: 3px 7px; margin-left: 3px; font-size: 10px; }
      .recipe button:hover { background: #465878; }
      #craft-queue { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 7px;
        min-height: 14px; color: var(--muted); line-height: 1.6; }
      #craft-ready { margin: 6px 0; color: #a5d6a7; }
      #claim-btn { width: 100%; border: 0; border-radius: 6px; background: var(--gold); color: var(--bg);
        font-weight: bold; padding: 6px; cursor: pointer; }
      #claim-btn:disabled { background: #2b3545; color: #64708a; cursor: default; }

      /* ---- 하단: 채팅 ---- */
      #chatlog { position: absolute; left: 12px; bottom: 52px; width: 380px; max-height: 190px; overflow: hidden;
        display: flex; flex-direction: column; justify-content: flex-end; font-size: 13px;
        text-shadow: 0 1px 3px #000; line-height: 1.5; }
      #chatlog div { padding: 1px 4px; }
      #chatlog .sys { color: var(--muted); }
      #chatbox { position: absolute; left: 12px; bottom: 12px; width: 380px; pointer-events: auto; }
      #chatbox input { width: 100%; box-sizing: border-box; padding: 9px 12px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--panel); color: var(--text); }
      #gatherbar { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); width: 220px; height: 10px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: none; overflow: hidden; }
      #gatherbar > div { height: 100%; width: 0%; background: var(--gold); }

      /* ---- 모달: 시장 · 거래 ---- */
      .modal { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
        background: rgba(16,20,28,.97); border: 1px solid var(--gold); border-radius: 12px; padding: 16px 20px;
        font-size: 12px; pointer-events: auto; z-index: 10; backdrop-filter: blur(8px);
        box-shadow: 0 12px 40px rgba(0,0,0,.5); }
      .modal h2 { margin: 0 0 10px; font-size: 13px; color: var(--gold);
        display: flex; justify-content: space-between; align-items: center; }
      .modal h2 button { border: 0; border-radius: 5px; background: #2b3545; color: var(--text);
        padding: 3px 10px; cursor: pointer; }
      .modal h3 { margin: 8px 0 4px; font-size: 11px; color: var(--muted); }

      #market { width: 460px; }
      #market select, #market input { background: #1a2130; color: var(--text); border: 1px solid var(--line);
        border-radius: 5px; padding: 5px; }
      #market input { width: 66px; }
      #market .row { display: flex; gap: 6px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
      #market .row button { border: 0; border-radius: 6px; padding: 5px 11px; cursor: pointer;
        background: #33405a; color: var(--text); }
      #market-buy { background: #3f7a52 !important; }
      #market-sell { background: #7a4a4a !important; }
      .bookcols { display: flex; gap: 20px; }
      .bookcols > div { flex: 1; line-height: 1.6; }
      #market-book, #market-orders { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px;
        line-height: 1.7; }
      #market-orders button { padding: 1px 7px; font-size: 10px; border: 0; border-radius: 4px;
        background: #2b3545; color: var(--text); cursor: pointer; margin-left: 4px; }

      #trade { width: 380px; }
      #trade .cols { display: flex; gap: 16px; }
      #trade .cols > div { flex: 1; }
      .trade-item { cursor: pointer; padding: 3px 5px; border-radius: 4px; }
      .trade-item:hover { background: #2a3346; }
      #trade-status { margin: 10px 0; color: var(--gold); }
      #trade .btns { display: flex; gap: 8px; }
      #trade .btns button { flex: 1; border: 0; border-radius: 6px; padding: 7px; cursor: pointer; font-weight: bold; }
      #trade-accept { background: var(--gold); color: var(--bg); }
      #trade-accept:disabled { background: #2b3545; color: #64708a; }
      #trade-cancel { background: #2b3545; color: var(--text); }
      #trade-req { display: none; position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
        background: rgba(16,20,28,.96); border: 1px solid var(--gold); border-radius: 8px; padding: 9px 16px;
        font-size: 13px; pointer-events: auto; z-index: 10; }
      #trade-req button { border: 0; border-radius: 5px; padding: 4px 12px; margin-left: 6px; cursor: pointer; }
      #trade-req-yes { background: var(--gold); }
      #trade-req-no { background: #2b3545; color: var(--text); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="login">
        <form id="login-form">
          <h1>MyRPG — 하란 마을</h1>
          <div class="sub">고비주얼 클라이언트 (3D)<br />테스트 클라이언트는 :5173 또는 /test</div>
          <input id="name" placeholder="이름 (2~16자)" autocomplete="off" maxlength="16" />
          <button type="submit">입장</button>
          <div class="err" id="login-err"></div>
        </form>
      </div>

      <div id="hud">
        <div id="topleft">
          <div id="hint">WASD·화살표: 이동 · 클릭: 목표 이동 · 자원 클릭: 채집 · 플레이어 클릭: 거래 · 휠: 줌 · Enter: 채팅</div>
        </div>

        <div id="sidebar">
          <div class="panel" id="purse">
            <span id="silver">0 은화</span>
            <button id="market-toggle">시장</button>
          </div>
          <div class="panel">
            <h2>가방</h2>
            <div id="inv-items">비어 있음</div>
          </div>
          <div class="panel">
            <h2>제작 큐</h2>
            <div id="craft-recipes"></div>
            <div id="craft-queue"></div>
            <div id="craft-ready"></div>
            <button id="claim-btn" disabled>완료품 수령</button>
          </div>
          <div class="panel">
            <h2>생활 스킬</h2>
            <div id="skills-list"></div>
          </div>
        </div>

        <div id="chatlog"></div>
        <div id="gatherbar"><div></div></div>
        <div id="chatbox"><input id="chat-input" placeholder="Enter로 채팅" maxlength="200" /></div>

        <div id="trade-req">🤝 <span id="trade-req-name"></span> 님의 거래 요청
          <button id="trade-req-yes">수락</button><button id="trade-req-no">거절</button></div>

        <div id="market" class="modal">
          <h2>위탁 거래소 <button id="market-close">닫기</button></h2>
          <div class="row">
            <select id="market-item"></select>
            가격 <input id="market-price" type="number" min="1" value="20" />
            수량 <input id="market-qty" type="number" min="1" value="1" />
          </div>
          <div class="row">
            <button id="market-buy">매수 등록</button>
            <button id="market-sell">매도 등록</button>
            <button id="npc-buy">NPC 구매</button>
            <button id="npc-sell">NPC 판매</button>
          </div>
          <div id="market-book"></div>
          <div id="market-orders"></div>
        </div>

        <div id="trade" class="modal">
          <h2>거래 — <span id="trade-partner"></span></h2>
          <div class="cols">
            <div><h3>내 제안 (클릭해 빼기)</h3><div id="trade-mine"></div>
              <h3>가방 (클릭해 넣기)</h3><div id="trade-bag"></div></div>
            <div><h3>상대 제안</h3><div id="trade-theirs"></div></div>
          </div>
          <div id="trade-status"></div>
          <div class="btns"><button id="trade-accept">확정</button><button id="trade-cancel">취소</button></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
